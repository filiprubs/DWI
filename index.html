<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat com IA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <aside id="lateral" class="lateral" aria-label="Conversas anteriores">
        <button id="btn-nova" type="button" class="nova">
          + Nova conversa
        </button>
        <ul id="lista" class="lista"></ul>
        <p id="lista-vazia" class="lista-vazia">
          Nenhuma conversa salva ainda.
        </p>
      </aside>

      <div id="fundo" class="fundo"></div>

      <div class="app">
        <header class="topo">
          <button
            id="btn-menu"
            type="button"
            class="menu"
            aria-label="Abrir conversas"
          >
            ☰
          </button>
          <h1>Chat com IA</h1>
        </header>

        <main id="mensagens" class="mensagens" aria-live="polite">
          <p id="vazio" class="vazio">
            Escreva uma pergunta abaixo para começar a conversa.
          </p>
        </main>

        <form id="form" class="entrada">
          <textarea
            id="campo"
            rows="1"
            placeholder="Digite sua mensagem..."
            aria-label="Mensagem"
          ></textarea>
          <button id="btn-enviar" type="submit">Enviar</button>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
